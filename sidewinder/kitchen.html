<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kuchyně">
<meta name="theme-color" content="#1d2330">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<title>Kuchyně</title>
<!-- no manifest on purpose: "Add to Home Screen" keeps this page's address with the key after # -->
<style>
  :root { --bg:#14181f; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e2e6ee; --ok:#1f8a4c; --bad:#c0392b; --new:#f0b429; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  button, input { font:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system, system-ui, "Segoe UI", sans-serif; background:var(--bg); color:#fff; }
  header { position:sticky; top:0; z-index:5; background:#1d2330; padding:10px 16px; padding-top:max(10px, env(safe-area-inset-top));
           display:flex; align-items:center; gap:12px; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  header h1 { margin:0; font-size:20px; margin-right:auto; }
  .count { background:var(--new); color:#3d2c00; border-radius:999px; padding:4px 12px; font-weight:700; font-size:18px; }
  .count.zero { background:#2c3442; color:#9aa3b5; }
  #status { font-size:13px; color:#9aa3b5; }
  #status.err { color:#ff8a7a; font-weight:600; }
  main { padding:12px 16px 40px; max-width:720px; margin:0 auto; }
  .order { background:var(--card); color:var(--ink); border-radius:14px; margin-bottom:14px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  .order.fresh { animation:pop 1.2s ease-out; }
  @keyframes pop { 0% { box-shadow:0 0 0 6px var(--new); } 100% { box-shadow:0 4px 14px rgba(0,0,0,.25); } }
  .oh { display:flex; align-items:baseline; gap:10px; padding:12px 16px 6px; }
  .oh b { font-size:22px; }
  .oh span { color:var(--muted); font-size:15px; }
  .oh .age { margin-left:auto; font-weight:600; }
  .age.late { color:var(--bad); }
  ul { list-style:none; margin:0; padding:0 16px 8px; }
  li { padding:8px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .item { font-size:24px; font-weight:700; }
  .q { display:inline-block; min-width:44px; color:var(--ok); }
  .tops { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; padding-left:44px; }
  .tops span { background:#eef6f1; color:#14532d; border:1px solid #bfe3cc; border-radius:999px; padding:4px 12px; font-size:18px; font-weight:600; }
  .plain { color:var(--muted); font-size:16px; padding-left:44px; }
  .done-btn { display:block; width:100%; border:0; background:var(--ok); color:#fff; font-size:22px; font-weight:700; padding:18px; min-height:64px; cursor:pointer; }
  .done-btn:active { filter:brightness(.9); }
  .order.void { outline:4px solid var(--bad); }
  .order.void .item { text-decoration:line-through; color:var(--muted); }
  .order.void .done-btn { background:var(--bad); }
  .voidtag { background:var(--bad); color:#fff; padding:8px 16px; font-weight:700; font-size:18px; }
  .order.sending { opacity:.5; }
  .empty { text-align:center; color:#9aa3b5; font-size:20px; padding:60px 0; }
  h2 { font-size:15px; color:#9aa3b5; text-transform:uppercase; letter-spacing:.06em; margin:28px 0 8px; }
  .doneRow { display:flex; align-items:center; gap:10px; background:#232a36; border-radius:10px; padding:8px 12px; margin-bottom:6px; color:#cfd5e0; }
  .doneRow .t { flex:1; font-size:15px; }
  .doneRow button { background:#2f3847; color:#fff; border:0; border-radius:8px; padding:10px 14px; min-height:44px; cursor:pointer; }
  .setup { background:var(--card); color:var(--ink); border-radius:14px; padding:20px; margin-top:20px; }
  .setup input { width:100%; font-size:18px; padding:12px; border:1px solid var(--line); border-radius:8px; margin:6px 0 12px; }
  .setup button { background:var(--ok); color:#fff; border:0; border-radius:10px; padding:14px 20px; font-size:18px; cursor:pointer; }
  #start { position:fixed; inset:0; background:rgba(20,24,31,.96); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px; }
  #start button { background:var(--ok); color:#fff; border:0; border-radius:14px; font-size:26px; font-weight:700; padding:24px 40px; cursor:pointer; }
  #start p { color:#9aa3b5; max-width:340px; }
</style>
</head>
<body>
<header>
  <h1>Kuchyně</h1>
  <span class="count zero" id="count">0</span>
  <span id="status"></span>
</header>
<main>
  <div id="orders"></div>
  <div id="doneBox"></div>
  <div class="setup" id="setup" style="display:none">
    <b>Connect the kitchen screen</b>
    <p>Easiest: on the cash desk open <b>Settings → Kitchen phone</b> and scan the QR code with this phone.</p>
    <p>Or type the key (the same as in the cash desk Settings):</p>
    <input id="keyIn" autocomplete="off" autocapitalize="off" placeholder="Key">
    <button id="keySave">Connect</button>
  </div>
</main>
<div id="start">
  <button id="startBtn">Start</button>
  <p>Tap to start: the phone will then beep for every new order and keep the screen on.</p>
</div>
<script src="kitchen.js"></script>
</body>
</html>
