<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuchyně (old)">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Kuchyně se přestěhovala</title>
<style>
  body { margin:0; background:#f4f6fa; color:#1d2330; font:18px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px; }
  .card { background:#fff; border:1px solid #e2e6ee; border-radius:14px; padding:20px; }
  h1 { margin:0 0 8px; font-size:26px; }
  .btn { display:inline-block; background:#1f6f43; color:#fff; border-radius:10px; padding:14px 20px; font-weight:600; text-decoration:none; margin:10px 0; }
  ol { padding-left:22px; } li { margin:8px 0; }
  @media (prefers-color-scheme: dark) { body { background:#14171d; color:#e8ebf1; } .card { background:#1d2129; border-color:#2c323d; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Kitchen screen moved</h1>
    <p>Viper is now <b>Sidewinder</b>, so the kitchen screen has a new address.</p>
    <ol>
      <li><a class="btn" id="open" target="_blank" rel="noopener">Open the new kitchen screen</a></li>
      <li>In Safari tap Share → <b>Add to Home Screen</b>.</li>
      <li>Delete this old icon.</li>
    </ol>
  </div>
</main>
<script>
  // the key comes from this page's address (#u=..&k=..) or from what the old kitchen screen saved
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const h = new URLSearchParams(location.hash.slice(1));
  const key = h.get("k") || get("viperKitchenKey"), url = h.get("u") || get("viperKitchenUrl");
  document.getElementById("open").href = new URL("../sidewinder/kitchen.html", location.href).href +
    (key ? "#u=" + encodeURIComponent(url || "") + "&k=" + encodeURIComponent(key) : "");
</script>
</body>
</html>
